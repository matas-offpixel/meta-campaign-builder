name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The parent-sha "falsify" tests (grep `const PARENT =` under
          # lib/**/__tests__) run `git show <sha>:<path>` against a PINNED
          # ancestor commit — the PR's own parent at the time it was written,
          # 6–14 commits behind main today — not HEAD's parent. The default
          # depth-1 clone has none of those objects, so all of them fail with
          # `fatal: invalid object name`; depth 2 would still lack them. Full
          # history is the only depth that always has every pinned sha. The
          # tests keep failing loudly on a missing object — never skip them.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  frames:
    name: frames:check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENABLE_PLAN_FRAMES: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # @playwright/test@1.63.0 pins Chromium r1243. Do not loosen 0.2%.
      - run: npx playwright install --with-deps chromium
      - name: Build frames app
        run: ENABLE_PLAN_FRAMES=1 npm run build
      # Writes frames-evidence/: shots/<id>.png for every shot (the Ubuntu
      # rasters), diff/<id>/{expected,actual,diff}.png for each shot over
      # tolerance, and index.md / index.json (file → frame id, width, check).
      # Every write killswitch stays unset in this job; fixtures only.
      - name: Diff frames
        run: ENABLE_PLAN_FRAMES=1 node scripts/plan-frames/run.mjs --check
      - name: Upload plan-frames evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-frames
          path: frames-evidence/
          if-no-files-found: ignore
